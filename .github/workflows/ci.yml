name: DB-Sentinel-CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test-and-build:
    name: Test & Build Go Core Engine
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: server/go.sum

      - name: Run unit tests
        run: go test -v -race -cover ./...

      - name: Verify Go Server build
        run: CGO_ENABLED=0 GOOS=linux go build -v -o dbsentinel-server .
  
  lint-and-sec:
    name: Code Quality & Security Scan
    runs-on : ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache: true
          cache-dependency-path: server/go.sum

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          working-directory: ./server
      
      - name: Run govulncheck
        uses: golang/govulncheck-action@v1
        with:
          work-dir: ./server
  
  docker-build:
    name: Verify Docker Image Build
    needs: [test-and-build, lint-and-sec]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image (Check only)
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: false
          tags: dbsentinel-server:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max